# /etc/systemd/logind.conf.d/10-dotfiles-lid.conf
#
# Closing the lid on battery should still suspend. Closing it while docked or on
# AC must not — that's the "shut the laptop, keep working on the monitors" case,
# and it has to hold at the GDM greeter too, or the machine suspends before you
# ever get a chance to log in.
#
# `Docked` alone isn't enough: logind only counts a dock when something is
# plugged into a *video* port it can see, which the NVIDIA driver doesn't always
# expose. ExternalPower is the reliable signal for a powered dock.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
