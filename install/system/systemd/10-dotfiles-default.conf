# /etc/systemd/system/autorandr.service.d/10-dotfiles-default.conf
#
# The shipped unit runs `--default default`, but there is no profile called
# "default", so every hotplug ends in "Failed to load profile 'default'" and an
# unknown monitor set gets no layout at all. `horizontal` is autorandr's
# built-in fallback: all connected outputs, preferred mode, side by side.
[Service]
ExecStart=
ExecStart=/usr/bin/autorandr --batch --change --default horizontal
